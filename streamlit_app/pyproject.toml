[project]
name = "wtec-streamlit"
version = "0.1.0"
description = "Wind Turbine Earthwork Calculator — Streamlit SaaS"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "streamlit-folium>=0.20",
    "folium>=0.16",
    "numpy>=1.26",
    "shapely>=2.0",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "scipy>=1.11",
    "ezdxf>=1.1",
    "matplotlib>=3.8",
    "weasyprint>=60",
    "jinja2>=3.1",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "requests>=2.31",
    "fiona>=1.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

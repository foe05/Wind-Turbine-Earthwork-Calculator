services:
  app:
    container_name: wtec-app
    restart: unless-stopped
    # Public-Port aus der base compose.yml entfernen — Traffic kommt jetzt
    # ausschließlich über den NPM-Reverse-Proxy auf v1.kubatur.app rein.
    ports: !reset []
    environment:
      # Damit `from app.services.pipeline import ...` aus Home.py funktioniert:
      # /app ist Container-WORKDIR, das Skript liegt in /app/app/Home.py.
      PYTHONPATH: /app
      # Telemetrie abdrehen + Streamlit dem Reverse-Proxy gegenüber
      # nachgiebig konfigurieren.
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "false"
      STREAMLIT_SERVER_ENABLE_CORS: "false"
    networks:
      - default     # für die DB
      - proxy       # für NPM
    deploy:
      resources:
        limits:
          memory: 2g

  db:
    container_name: wtec-db
    restart: unless-stopped
    shm_size: 256m
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=384MB
      -c max_connections=20
    deploy:
      resources:
        limits:
          memory: 768m

networks:
  proxy:
    name: docker-apps_proxy
    external: true
